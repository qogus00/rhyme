</script>
<style>
:root{
  --paper:#F0FAF3; --surface:#FFFFFF; --surface-2:#E9F7EE; --ink:#16301F; --ink-2:#4F6B58; --ink-3:#8AA394;
  --rule:#D3EEDB; --rule-strong:#A6DDB5; --margin:#FFB4A8;
  --brand:#2ED16B; --brand-ink:#063D1B; --brand-text:#14883F; --brand-soft:#D7F7E2;
  --exp:#E5484D; --inc:#2F7DE1; --sav:#B97A00; --warn:#F59E0B;
  --shadow:0 1px 2px rgba(20,136,63,.08);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A14; --surface:#17241C; --surface-2:#1D2E23; --ink:#E6F5EB; --ink-2:#A3C2AE; --ink-3:#6F8E7A;
    --rule:#26392D; --rule-strong:#355040; --margin:#7A3F38;
    --brand:#4ADE80; --brand-ink:#052E16; --brand-text:#4ADE80; --brand-soft:#183A26;
    --exp:#FF6B6B; --inc:#6AA8FF; --sav:#F5C04A; --warn:#FBBF24;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A14; --surface:#17241C; --surface-2:#1D2E23; --ink:#E6F5EB; --ink-2:#A3C2AE; --ink-3:#6F8E7A;
    --rule:#26392D; --rule-strong:#355040; --margin:#7A3F38;
    --brand:#4ADE80; --brand-ink:#052E16; --brand-text:#4ADE80; --brand-soft:#183A26;
    --exp:#FF6B6B; --inc:#6AA8FF; --sav:#F5C04A; --warn:#FBBF24;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.exp{color:var(--exp)} .inc{color:var(--inc)} .sav{color:var(--sav)} .muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand .ver{font-size:11px;font-weight:500;color:var(--ink-3);margin-left:5px;letter-spacing:0;vertical-align:2px}
.brand small{font-weight:500;color:var(--ink-2);font-size:13px;margin-left:6px}
.monthnav{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:2px}
.mnwrap{margin-left:auto;position:relative}
.mnwrap .monthnav{margin-left:0}
.monthnav button{border:0;background:none;width:34px;height:34px;border-radius:999px;font-size:18px;line-height:1}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .mlabel{width:auto;min-width:96px;padding:0 8px;font-weight:700;font-size:15px;white-space:nowrap}
.monthnav .mlabel::after{content:'▾';font-size:11px;color:var(--ink-2);margin-left:4px;vertical-align:1px}
.monthnav .mlabel[aria-expanded="true"]{background:var(--brand-soft)}
.mpicker{position:absolute;right:0;top:calc(100% + 8px);width:292px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--rule-strong);border-radius:14px;box-shadow:0 12px 32px rgba(20,90,45,.18);padding:12px;z-index:40}
@media (max-width:520px){.mpicker{position:fixed;left:12px;right:12px;width:auto;max-width:none;top:calc(env(safe-area-inset-top,0px) + 62px)}}
.mp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mp-h b{font-size:16px}
.mp-h button{border:1px solid var(--rule);background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mp-grid button{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:11px 0 13px;font-weight:500;position:relative}
.mp-grid button:hover{background:var(--surface-2)}
.mp-grid button.has::after{content:'';position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--brand)}
.mp-grid button.now{border-color:var(--brand-text);color:var(--brand-text);font-weight:700}
.mp-grid button[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.mp-grid button[aria-current="true"].has::after{background:var(--brand-ink)}
.mp-f{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--ink-2)}
.mp-f i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-right:5px;vertical-align:1px}
.monthnav b{min-width:84px;text-align:center;font-size:15px;white-space:nowrap}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
.tabs{display:none}
main{max-width:1080px;margin:0 auto;padding:16px 16px 96px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav-btn{border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn svg{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:var(--brand-text);font-weight:700}
.mfab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(46,209,107,.45)}
@media (min-width:900px){.mfab{display:none}}
.nav-add button{width:58px;height:58px;margin-top:-22px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(46,209,107,.45)}
@media (min-width:900px){
  .tabs{display:flex;gap:4px;margin-left:18px}
  .tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:500}
  .tabs button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
  .bottomnav{display:none}
  .fab{display:inline-flex!important}
  main{padding-bottom:48px}
}
.bksheet{max-width:640px}
.bklist{display:grid;gap:6px;max-height:60vh;overflow:auto;margin:6px 0}
.bkitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 12px}
.bkitem:hover:not(:disabled){border-color:var(--brand-text);background:var(--brand-soft)}
.bkitem:disabled{opacity:.55;cursor:default}
.bk-k{font-weight:700;font-size:14px}
.bk-t{font-size:13px;color:var(--ink-2);text-align:right}
.bk-s{font-size:13px;grid-column:1/-1}
.bk-n{font-size:11px;grid-column:1/-1}
.syncbox{display:grid;gap:6px;margin:10px 0 4px;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:10px;background:var(--brand-soft)}
.syncbox .btn{justify-self:start}
.modebtn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink-2)}
.modebtn:hover{border-color:var(--brand-text);color:var(--brand-text)}
@media (max-width:520px){.modebtn{padding:6px 8px}}
.me{font-size:12px;color:var(--ink-2);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}

  // 사용자가 정한 순서와 영역(소비성·저축성)대로 생활비 항목 정렬
  { const ord = st.catOrder || []; const live = CATS.e.filter(c=>c.g==='live'); const rest = CATS.e.filter(c=>c.g!=='live');
    const pos = new Map(live.map((c,i)=>[c.k, ord.includes(c.k) ? ord.indexOf(c.k) : 1000+i]));
    live.sort((a,b)=> (secOf(a.k)==='spend'?0:1) - (secOf(b.k)==='spend'?0:1) || pos.get(a.k)-pos.get(b.k));
    CATS.e.splice(0, CATS.e.length, ...live, ...rest); }
  LIVE.splice(0, LIVE.length, ...CATS.e.filter(c=>c.g==='live').map(c=>c.k));
  // 수입·이체 분류도 아이콘·이름 바꾸기 반영
  for (const [t, B] of [['i', BASE_I], ['x', BASE_X]]){

    CATS[t].forEach(c => CAT[c.k] = {...c, t});

}

function mergeSilently(o){

  // 데이터가 없는 공개용 화면이면 깃허브 연결부터, 데이터가 든 파일이면 저장 위치부터
  if (!Object.keys(S.months).length) setTimeout(openGhSetup, 300); else initStorage();
}

async function mutateMonth(mk, fn){
  const before = new Map((S.months[mk] || []).map(x => [x.id, JSON.stringify(x)]));
  const next = fn((S.months[mk] || []).slice());
  const now = Date.now(); const after = new Set();
  for (const x of next){ after.add(x.id); if (before.get(x.id) !== JSON.stringify(x)){ x.u = now; delete S.deleted[x.id]; } }
  for (const id of before.keys()) if (!after.has(id)) S.deleted[id] = now;
  if (next.length) S.months[mk] = next; else delete S.months[mk];
  if (isGH()){ ghMarkChanged(); render(); } else { saveDraft(); render(); }
}
async function saveSettings(){ S.settings._u = Date.now(); if (isGH()){ ghMarkChanged(); render(); } else { saveDraft(); render(); } }
function writeError(e){ toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.'); }

async function upsertItem(item, oldDate){
  const mk = ymOf(item.d), oldMk = oldDate ? ymOf(oldDate) : null;
  try {
    if (oldMk && oldMk !== mk) await mutateMonth(oldMk, arr => arr.filter(x=>x.id!==item.id));
    await mutateMonth(mk, arr => { const i = arr.findIndex(x=>x.id===item.id); if (i>=0) arr[i]=item; else arr.push(item); return arr; });
    return true;
  } catch(e){ writeError(e); return false; }
}
async function deleteItem(item){
  try { await mutateMonth(ymOf(item.d), arr => arr.filter(x=>x.id!==item.id)); return true; } catch(e){ writeError(e); return false; }
}


/* ============ 깃허브 동기화: 비공개 저장소의 data.json 을 두 사람이 함께 씀 ============ */
const GH_CFG_KEY = 'rhyme-gh', GH_CACHE_KEY = 'rhyme-gh-cache';
const GH = { cfg:null, sha:null, login:'', lastSync:'', status:'', timer:null, busy:false, pending:false, offline:false, poll:null };
S.deleted = {};      // 지운 내역 기록 (다른 기기에도 지워지도록) {id: 지운 시각}
try { GH.cfg = JSON.parse(localStorage.getItem(GH_CFG_KEY) || 'null'); } catch(e){}
const isGH = () => !!(GH.cfg && GH.cfg.token && GH.cfg.owner && GH.cfg.repo);
const ghPath = () => GH.cfg.path || 'data.json';
const ghBranch = () => GH.cfg.branch || 'main';

function b64enc(str){ const b = new TextEncoder().encode(str); let bin = ''; for (let i=0;i<b.length;i+=0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(bin); }
function b64dec(b64){ const bin = atob((b64||'').replace(/\s/g,'')); const b = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }

async function gh(path, opt={}, cfg=GH.cfg){
  const r = await fetch('https://api.github.com' + path, { ...opt, cache:'no-store', headers:{ 'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + cfg.token, 'X-GitHub-Api-Version':'2022-11-28', ...(opt.body ? {'Content-Type':'application/json'} : {}) } });
  let j = null; try { j = await r.json(); } catch(e){}
  return { status:r.status, ok:r.ok, json:j };
}
/* 저장소의 data.json 읽기 → {exists, sha, data} */
async function ghRead(cfg=GH.cfg){
  const r = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(cfg.path||'data.json')}?ref=${encodeURIComponent(cfg.branch||'main')}`, {}, cfg);
  if (r.status === 404) return { exists:false, sha:null, data:null };
  if (!r.ok) throw Object.assign(new Error('read'), { status:r.status, msg:(r.json&&r.json.message)||'' });
  let text;
  if (r.json.content) text = b64dec(r.json.content);
  else { const b = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/blobs/${r.json.sha}`, {}, cfg); text = b64dec(b.json.content); }   // 1MB 넘을 때
  return { exists:true, sha:r.json.sha, data: JSON.parse(text||'{}') };
}
async function ghWrite(data, sha, message){
  const body = { message, content: b64enc(JSON.stringify(data)), branch: ghBranch(), ...(sha ? {sha} : {}) };
  const r = await gh(`/repos/${GH.cfg.owner}/${GH.cfg.repo}/contents/${encodeURIComponent(ghPath())}`, { method:'PUT', body: JSON.stringify(body) });
  if (r.ok) return r.json.content.sha;
  throw Object.assign(new Error('write'), { status:r.status, msg:(r.json&&r.json.message)||'' });
}

/* 두 쪽 데이터를 합치기: 같은 내역은 더 최근에 고친 쪽, 지운 기록이 더 최근이면 지움 */
const stampOf = x => Math.max(x.u||0, x.ets||0, x.ts||0);
function mergeState(L, R){
  const del = { ...(R.deleted||{}) };
  for (const [id,t] of Object.entries(L.deleted||{})) if (!del[id] || t > del[id]) del[id] = t;
  const map = new Map();
  const add = x => { const c = map.get(x.id); if (!c || stampOf(x) > stampOf(c)) map.set(x.id, x); };
  Object.values(R.months||{}).flat().forEach(add);
  Object.values(L.months||{}).flat().forEach(add);
  const months = {};
  for (const [id, x] of map){ if (del[id] && del[id] >= stampOf(x)) continue; (months[ymOf(x.d)] = months[ymOf(x.d)] || []).push(x); }
  const ls = L.settings||{}, rs = R.settings||{};
  const settings = (!Object.keys(rs).length || (ls._u||0) > (rs._u||0)) ? ls : rs;
  return { version:1, months, settings, deleted:del };
}
const stateNow = () => ({ months:S.months, settings:S.settings, deleted:S.deleted });
const sameState = (a, b) => JSON.stringify(a.months)===JSON.stringify(b.months) && JSON.stringify(a.settings)===JSON.stringify(b.settings) && JSON.stringify(a.deleted||{})===JSON.stringify(b.deleted||{});

function ghSaveCache(){ try { localStorage.setItem(GH_CACHE_KEY, JSON.stringify({ owner:GH.cfg.owner, repo:GH.cfg.repo, sha:GH.sha, pending:GH.pending, ...stateNow() })); } catch(e){} }
function ghLoadCache(){
  try { const c = JSON.parse(localStorage.getItem(GH_CACHE_KEY) || 'null');
    if (c && c.owner===GH.cfg.owner && c.repo===GH.cfg.repo){ S.months = c.months||{}; S.settings = {...structuredClone(DEFAULT_SETTINGS), ...(c.settings||{})}; S.deleted = c.deleted||{}; GH.sha = c.sha||null; GH.pending = !!c.pending; return true; } } catch(e){}
  return false;
}
function ghMarkChanged(){ GH.pending = true; ghSaveCache(); updateSaveBtn(); clearTimeout(GH.timer); GH.timer = setTimeout(()=>ghSync(), 1500); }

/* 동기화: 최신 받기 → 합치기 → 바뀐 게 있으면 올리기 (다른 사람이 먼저 올렸으면 다시 받아 합침) */
async function ghSync(quiet){
  if (!isGH() || GH.busy) return;
  GH.busy = true; clearTimeout(GH.timer); updateSaveBtn();
  try {
    for (let attempt = 0; attempt < 4; attempt++){
      const remote = await ghRead();
      const R = remote.data || {months:{}, settings:{}, deleted:{}};
      const merged = mergeState(stateNow(), R);
      const changedLocal = !sameState(merged, stateNow());
      if (!remote.exists || !sameState(merged, R)){
        try { GH.sha = await ghWrite(merged, remote.sha, `Rhyme: ${GH.cfg.device||'기기'} ${new Date().toLocaleString('ko-KR')}`); }
        catch(e){ if (e.status === 409 || e.status === 422){ continue; } throw e; }   // 그사이 다른 사람이 올림 → 다시
      } else GH.sha = remote.sha;
      S.months = merged.months; S.settings = {...structuredClone(DEFAULT_SETTINGS), ...merged.settings}; S.deleted = merged.deleted;
      GH.pending = false; GH.offline = false; GH.status = ''; GH.lastSync = new Date().toISOString();
      ghSaveCache();
      if (changedLocal && !F) render();
      break;
    }
  } catch(e){
    GH.offline = !e.status; GH.status = e.status === 401 ? '토큰이 맞지 않거나 만료되었어요.' : e.status === 404 ? '저장소를 찾을 수 없어요.' : e.status === 403 ? '토큰에 이 저장소 쓰기 권한이 없어요.' : e.status ? `깃허브 오류 (${e.status}) ${e.msg||''}` : '인터넷에 연결되지 않았어요. 입력 내용은 이 브라우저에 보관했다가 연결되면 올려요.';
    if (!quiet && e.status) toast('동기화하지 못했어요: ' + GH.status);
  } finally { GH.busy = false; updateSaveBtn(); if (V.view==='settings' && !F) render(); }
}
function ghStartPolling(){
  clearInterval(GH.poll);
  GH.poll = setInterval(() => { if (document.visibilityState==='visible' && !F && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) ghSync(true); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') ghSync(true); else if (GH.pending) ghSync(true); });
  window.addEventListener('online', () => ghSync(true));
}

/* ============ 집계 ============ */
const itemsOf = ym => (S.months[ym]||[]);
const yearItems = y => Object.keys(S.months).filter(k=>k.startsWith(y+'-')).flatMap(k=>S.months[k]);
function rangeItems(from, to){ // iso inclusive
  const out=[]; let ym = ymOf(from); const end = ymOf(to);
  while (ym <= end){ itemsOf(ym).forEach(x=>{ if (x.d>=from && x.d<=to) out.push(x); }); ym = shiftYm(ym,1); }
  return out;
}
function summarize(list){
  const s = {inc:0, live:0, fixed:0, saving:0, transfer:0, byCat:{}};
  for (const x of list){
    if (x.t==='i'){ s.inc += x.a; }
    else if (x.t==='x'){ s.transfer += x.a; }
    else { const g = (CAT[x.c]||{}).g || 'live'; if (g==='saving') s.saving += x.a; else if (g==='fixed') s.fixed += x.a; else s.live += x.a; }
    if (x.t!=='x') s.byCat[x.c] = (s.byCat[x.c]||0) + x.a;
  }
  s.exp = s.live + s.fixed; s.left = s.inc - s.exp - s.saving;
  return s;
}
/* 예산기준: 월·분기·년. 계산에는 월 환산액(분기 ÷3, 년 ÷12)을 씀 */
const PER = {m:{n:'월',d:1}, q:{n:'분기',d:3}, y:{n:'년',d:12}};
const perOf = k => (S.settings.budgetPeriods||{})[k] || 'm';
const mb = k => (+S.settings.budgets[k]||0) / PER[perOf(k)].d;
const liveBudget = () => LIVE.reduce((a,k)=>a+mb(k),0);
/* 하루 예산 = 그 달 생활비 예산 ÷ 그 달 일수. 주간 예산 = 해당 날짜들의 하루 예산 합 (또는 설정에서 직접 입력한 금액) */
const dayBudget = (dIso, k) => (k ? mb(k) : liveBudget()) / daysIn(ymOf(dIso));
function periodBudget(days, k){
  const auto = days.reduce((a,d)=>a+dayBudget(d,k),0);
  const wb = +S.settings.weeklyBudget||0;
  if (!wb || days.length!==7) return auto;
  if (!k) return wb;
  const tot = days.reduce((a,d)=>a+dayBudget(d),0); return tot ? wb*auto/tot : 0;
}
const liveSpent = (list, k) => list.filter(x=>x.t==='e' && (k ? x.c===k : LIVE.includes(x.c))).reduce((a,x)=>a+x.a,0);
function weekStartOf(d){ const ws = +S.settings.weekStart||0; const x = new Date(d); const diff = (x.getDay()-ws+7)%7; return addDays(x,-diff); }

function budRow(k, spent, bud){
  const c = CAT[k]; const r = bud? spent/bud : 0;

}
function fxVisible(rows){ if (V.fxOpen) return rows; return rows.slice().sort((a,b)=>(!!a.hit)-(!!b.hit) || (a.day||1)-(b.day||1)).slice(0,6); }
function fixedStatus(ym){
  const list = itemsOf(ym);
  const rows = (S.settings.fixed||[]).map(f => ({...f, hit: list.find(x => x.t==='e' && x.f && x.m===f.name)}));
  const names = new Set(rows.map(r=>r.name));
  const undoable = list.filter(x => x.src==='fx' || (x.f && x.t==='e' && names.has(x.m) && !/^x\d{4}$/.test(x.id)));
  return {rows, done: rows.filter(r=>r.hit).length, undoable};
}
function rowHtml(x){
  const c = CAT[x.c] || {i:'•',n:x.c};
  const sign = x.t==='i' ? '+' : x.t==='x' ? '' : '−';
  const cls = x.t==='i' ? 'inc' : x.t==='x' ? 'muted' : (CAT[x.c]||{}).g==='saving' ? 'sav' : 'exp';
  const amt = x.a<0 && x.t==='e' ? `+${won(-x.a)}` : `${sign}${won(Math.abs(x.a))}`;
  return `<li class="row" data-edit="${x.id}" data-ym="${ymOf(x.d)}" tabindex="0"><span class="ic" aria-hidden="true">${c.i}</span><span class="mm"><b>${esc(x.m||c.n)}</b><span>${c.n} · ${esc(payLabel(x))}${x.f?'<span class="tag">고정</span>':''}${x.t==='x'?'<span class="tag">이체</span>':''}${x.a<0&&x.t==='e'?'<span class="tag">환급·할인</span>':''}${whoTag(x)}</span></span><span class="am num ${cls}">${amt}</span></li>`;

/* ---------- 내역 ---------- */
function applyFilters(list){
  const f = V.filter, q = V.q.trim();

async function inlineSave(el){

function delta(cur, prev, label, upGood){
  if (!prev) return '';

  return `<em class="${good?'inc':'exp'}">${label} ${d>0?'▲':'▼'}${man(Math.abs(d))} (${p>0?'+':''}${p}%)</em>`;
}

function repMonth(){

const fixedTotal = () => (S.settings.fixed||[]).reduce((a,f)=>a+(+f.a||0),0);

function cashPlan(){
  const st = S.settings; const setInc = +st.monthlyIncome||0; const recInc = summarize(itemsOf(V.ym)).inc;
  const inc = setInc || recInc; const bud = liveBudget(); const fx = fixedTotal(); const cash = inc - bud - fx;
  return {inc, src: setInc ? 'set' : recInc ? 'rec' : 'none', bud, fx, cash, weekly: Math.floor(cash/daysIn(V.ym)*7)};
}

async function addCard(name, last4){
  if (cardsList().some(c=>c.name===name)){ toast(`‘${name}’ 카드가 이미 있어요.`); return null; }
  const c = {id:'c'+uid(), name}; if (last4) c.last4 = last4;
  S.settings.cards = [...cardsList(), c];
  try { await saveSettings(); toast(`‘${name}’ 카드를 등록했어요.`); } catch(e){ writeError(e); }

}
async function deleteCard(id){
  const c = cardById(id); if (!c) return;
  const used = Object.values(S.months).flat().filter(x=>x.card===id).length;
  if (!confirm(`‘${c.name}’ 카드를 지울까요?${used?`\n\n이 카드로 입력한 내역 ${used}건은 지워지지 않고 ‘삭제된 카드’로 표시돼요.`:''}`)) return;
  const snap = cardsList().slice();
  S.settings.cards = cardsList().filter(x=>x.id!==id);
  try { await saveSettings(); toast(`‘${c.name}’ 카드를 지웠어요.`, {label:'되돌리기', fn: async ()=>{ S.settings.cards = snap; await saveSettings(); toast('카드를 되살렸어요.'); }}); } catch(e){ writeError(e); }
}

  if (f==='name'){ if (!v){ el.value = c.name; toast('카드 이름은 비울 수 없어요.'); return; } if (v===c.name) return; if (cardsList().some(x=>x.name===v && x.id!==id)){ el.value=c.name; toast(`‘${v}’ 카드가 이미 있어요.`); return; } }

  S.settings.cards = cardsList().map(x=> x.id===id ? {...x, [f]: v} : x);

  try { await saveSettings(); toast('카드 정보를 고쳤어요.'); } catch(e){ writeError(e); }
}

async function moveCat(k, targetK, after, sec){
  if (!LIVE.includes(k)) return;
  const order = LIVE.filter(x=>x!==k);
  let idx;
  if (targetK && targetK!==k && order.includes(targetK)){ idx = order.indexOf(targetK) + (after?1:0); sec = secOf(targetK); }
  else { const inSec = order.filter(x=>secOf(x)===sec); idx = inSec.length ? order.indexOf(inSec[inSec.length-1])+1 : (sec==='spend' ? 0 : order.length); }
  order.splice(idx, 0, k);
  const oldSec = secOf(k); const same = JSON.stringify(order)===JSON.stringify(LIVE) && oldSec===sec;
  if (same) return;
  S.settings.catOrder = order; S.settings.catGroups = {...(S.settings.catGroups||{}), [k]:sec};
  try { await saveSettings(); toast(oldSec!==sec ? `‘${CAT[k].n}’을(를) ${SEC[sec]}으로 옮겼어요.` : `‘${CAT[k].n}’ 순서를 바꿨어요.`); } catch(e){ writeError(e); }
}
const DND = {k:null};
function clearDropMarks(){ document.querySelectorAll('.drop-before,.drop-after,.drop-end').forEach(el=>el.classList.remove('drop-before','drop-after','drop-end')); }
document.addEventListener('dragstart', e => {
  const g = e.target.closest && e.target.closest('[data-grip], li.row.bv[data-cat]'); if (!g) return;
  const row = g.closest('[data-cat]'); if (!row) return;
  DND.k = row.dataset.cat; e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', DND.k); e.dataTransfer.setDragImage(row, 24, 18); } catch(_){}
  setTimeout(()=>row.classList.add('dragging'), 0);
});
document.addEventListener('dragover', e => {
  if (!DND.k) return; const sec = e.target.closest && e.target.closest('.budsec'); if (!sec) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move'; clearDropMarks();
  const row = e.target.closest('[data-cat]');
  if (row && sec.contains(row)){ const r = row.getBoundingClientRect(); row.classList.add(e.clientY < r.top + r.height/2 ? 'drop-before' : 'drop-after'); }
  else sec.classList.add('drop-end');
});
document.addEventListener('drop', e => {
  if (!DND.k) return; const sec = e.target.closest && e.target.closest('.budsec'); if (!sec) return;
  e.preventDefault(); const row = e.target.closest('[data-cat]'); const k = DND.k;
  let target = null, after = false;
  if (row && sec.contains(row)){ target = row.dataset.cat; const r = row.getBoundingClientRect(); after = e.clientY >= r.top + r.height/2; }
  DND.k = null; clearDropMarks(); moveCat(k, target, after, sec.dataset.sec);
});
document.addEventListener('dragend', () => { DND.k = null; clearDropMarks(); document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging')); });
document.addEventListener('dragleave', e => { if (e.target.classList && e.target.classList.contains('budsec') && !e.target.contains(e.relatedTarget)) e.target.classList.remove('drop-end'); });

async function catFieldSave(el){
  const [k, f] = el.dataset.fid.slice(4).split('|'); const st = S.settings; const v = el.value.trim();
  if (k==='__income'){ const n = parseInt(v.replace(/[^0-9]/g,''),10)||0; if (n===(+st.monthlyIncome||0)) return; st.monthlyIncome = n; await new Promise(r=>setTimeout(r,0)); try{ await saveSettings(); toast(n?`월 수입을 ${wonU(n)}으로 정했어요.`:'월 수입을 비웠어요. 그 달에 입력된 수입으로 계산해요.'); }catch(e){ writeError(e); } return; }
  if (k==='__week'){ const n = parseInt(v.replace(/[^0-9]/g,''),10)||0; if (n===(+st.weeklyBudget||0)) return; st.weeklyBudget = n; await new Promise(r=>setTimeout(r,0)); try{ await saveSettings(); toast(n?`주간 예산을 ${wonU(n)}으로 정했어요.`:'주간 예산을 자동 계산으로 바꿨어요.'); }catch(e){ writeError(e); } return; }
  if (!CAT[k]) return;
  if (f==='p'){
    const old = perOf(k); if (v===old || !PER[v]) return;
    const monthly = mb(k); const amt = Math.round(monthly * PER[v].d);
    st.budgetPeriods = {...(st.budgetPeriods||{}), [k]:v}; if (v==='m') delete st.budgetPeriods[k];
    st.budgets = {...st.budgets, [k]:amt};
    await new Promise(r=>setTimeout(r,0));
    try{ await saveSettings(); toast(`${CAT[k].n} 예산기준을 ‘${PER[v].n}’로 바꿨어요. ${PER[v].n} ${wonU(amt)}${v==='m'?'':` (월 ${wonU(monthly)})`}`); }catch(e){ writeError(e); }
    return;
  }
  if (f==='b'){ const n = parseInt(v.replace(/[^0-9]/g,''),10)||0; if (n===(+st.budgets[k]||0)) return; st.budgets = {...st.budgets, [k]:n}; }
  else {
    if (f==='n'){ if (!v){ el.value = CAT[k].n; toast('항목 이름은 비울 수 없어요.'); return; } if (v===CAT[k].n) return; if (Object.values(CAT).some(c=>c.n===v && c.k!==k)){ el.value = CAT[k].n; toast(`‘${v}’ 항목이 이미 있어요.`); return; } }
    if (f==='i' && (v||'🏷️')===CAT[k].i) return;
    if (f==='i') V.iconMsg = `${CAT[k].n} 아이콘을 ${v||'🏷️'}(으)로 바꿨어요.`;
    const cc = (st.customCats||[]).find(c=>c.k===k);
    if (cc){ st.customCats = st.customCats.map(c=>c.k===k ? {...c, [f]: f==='i' ? (v||'🏷️') : v} : c); }
    else { const b = baseCat(k); if (!b) return; const e = {...((st.catEdits||{})[k]||{})}; const val = f==='i' ? (v||b.i) : v; if (val===b[f]) delete e[f]; else e[f] = val; st.catEdits = {...(st.catEdits||{}), [k]:e}; if (!Object.keys(e).length) delete st.catEdits[k]; }
  }
  await new Promise(r=>setTimeout(r,0));
  try{ await saveSettings(); toast(f==='i' && V.iconMsg ? V.iconMsg : f==='b' ? `${CAT[k].n} ${PER[perOf(k)].n} 예산을 ${wonU(st.budgets[k])}으로 고쳤어요.${perOf(k)==='m'?'':` (월 ${wonU(mb(k))})`}` : '고쳤어요.'); }catch(e){ writeError(e); }
}

async function deleteCats(keys){
  const st = S.settings; keys = keys.filter(k=>LIVE.includes(k));
  if (!keys.length) return;
  const remain = LIVE.filter(k=>!keys.includes(k));
  if (!remain.length){ toast('생활비 항목은 하나 이상 남아 있어야 해요.'); return; }
  const target = remain.includes('etc') ? 'etc' : remain[remain.length-1];
  const names = keys.map(k=>`‘${CAT[k].n}’`).join(', ');
  const used = Object.values(S.months).flat().filter(x=>keys.includes(x.c));
  const fxUsed = (st.fixed||[]).filter(f=>keys.includes(f.c));
  let msg = `${names} 항목을 지울까요?`;
  if (used.length || fxUsed.length) msg += `\n\n이 항목으로 입력한 내역 ${used.length}건${fxUsed.length?`과 고정지출 ${fxUsed.length}개`:''}는 ‘${CAT[target].n}’(으)로 옮겨져요.`;
  if (!confirm(msg)) return;
  const snapshot = JSON.parse(JSON.stringify(st)); const moved = used.map(x=>({id:x.id, d:x.d, c:x.c}));
  const byM = {}; moved.forEach(x=>(byM[ymOf(x.d)] = byM[ymOf(x.d)]||new Map()).set(x.id, x.c));
  try {
    for (const mk of Object.keys(byM)){ const m = byM[mk]; await mutateMonth(mk, arr => arr.map(x => m.has(x.id) ? {...x, c:target} : x)); }
    st.fixed = (st.fixed||[]).map(f => keys.includes(f.c) ? {...f, c:target} : f);
    st.customCats = (st.customCats||[]).filter(c=>!keys.includes(c.k));
    const baseKeys = keys.filter(k=>BASE_E.some(b=>b.k===k));
    st.hiddenCats = [...new Set([...(st.hiddenCats||[]), ...baseKeys])];
    keys.forEach(k=>{ delete st.budgets[k]; if (st.catEdits) delete st.catEdits[k]; if (st.budgetPeriods) delete st.budgetPeriods[k]; });
    V.catSel.clear();
    await saveSettings(); render();
    toast(`${names} 항목을 지웠어요.`, {label:'되돌리기', fn: async () => {
      for (const mk of Object.keys(byM)){ const m = byM[mk]; await mutateMonth(mk, arr => arr.map(x => m.has(x.id) ? {...x, c:m.get(x.id)} : x)); }
      S.settings = snapshot; await saveSettings(); render(); toast('항목을 되살렸어요.');
    }});
  } catch(e){ writeError(e); }
}

  }
  if (el('cYearCat')){

async function importData(o, label){
  if (!o || !o.months){ toast('백업 내용이 비어 있어요.'); return; }
  const inc = Object.values(o.months).flat();
  const have = new Set(Object.values(S.months).flat().map(x=>x.id));
  const add = inc.filter(x=>!have.has(x.id)).length;
  const where = S.desktop ? '이 PC 가계부' : `서버(${API_HOST}) 가계부`;
  if (!confirm(`${label ? '‘' + label + '’\n\n' : ''}백업의 내역 ${inc.length}건을 ${where}에 합칠까요?\n\n· 새로 추가되는 내역: ${add}건\n· 이미 있는 내역 ${inc.length-add}건은 백업 내용으로 바뀌어요\n· 지금 가계부에만 있는 내역은 그대로 남아요${o.settings && Object.keys(o.settings).length ? '\n· 예산·분류·고정지출 같은 설정도 백업 시점으로 바뀌어요' : ''}`)) return;
  try {
    for (const mk of Object.keys(o.months)){ const arrIn = o.months[mk]; await mutateMonth(mk, arr => { const map = new Map(arr.map(x=>[x.id,x])); arrIn.forEach(x=>map.set(x.id,x)); return [...map.values()]; }); }
    if (o.settings && Object.keys(o.settings).length){ S.settings = {...S.settings, ...o.settings}; await saveSettings(); }
    closeBackupPicker();
    toast(`백업을 불러왔어요. ${add}건이 새로 추가되었어요.`);
  } catch(e){ writeError(e); }
}
async function importJson(file){

      if (!IN_APP){ toast('.db 백업은 HTML 버전에서는 불러올 수 없어요. JSON 백업을 써 주세요.'); return; }

      readBudgetInputs();
      const k = 'u' + uid();
      S.settings.customCats = [...(S.settings.customCats||[]), {k, n:name, i:icon}];
      S.settings.budgets = {...S.settings.budgets, [k]:bud};
      { const np = (document.getElementById('newCatPer')||{}).value || 'm'; if (np!=='m') S.settings.budgetPeriods = {...(S.settings.budgetPeriods||{}), [k]:np}; }
      { const ns = (document.getElementById('newCatSec')||{}).value || 'save'; S.settings.catGroups = {...(S.settings.catGroups||{}), [k]:ns}; }
      try{ await saveSettings(); toast(`‘${name}’ 항목을 추가했어요.`); }catch(err){ writeError(err); }
      setTimeout(()=>{ const el=document.getElementById('newCatName'); if (el) el.focus(); }, 0);
      break; }
    case 'catDel': deleteCats([v]); break;
    case 'saveBudget': { readBudgetInputs(); try{ await saveSettings(); render(); toast('예산과 항목 이름을 저장했어요.'); }catch(err){ writeError(err); } break; }
    case 'fxAdd': { const list = readFxEditor(); list.push({id:uid(), name:'', c:'housing', a:0, day:1}); document.getElementById('fxList').innerHTML = list.map(fxEditRow).join(''); const ins=document.querySelectorAll('#fxList input[data-k="name"]'); ins[ins.length-1].focus(); break; }
    case 'fxDel': b.closest('.fxedit').remove(); break;
    case 'fxSave': S.settings.fixed = readFxEditor(); try{ await saveSettings(); toast('고정지출 목록을 저장했어요.'); }catch(err){ writeError(err); } break;
    case 'exportCsv': exportCsv(); break;
    case 'exportJson': exportJson(); break;
    case 'theme': localStorageSet('gagyebu-theme', v); applyTheme(); render(); break;
    // 입력 시트
    case 'fType': syncForm(); F.t = v; if (v!=='e') F.f=0; F.p = v==='e'?F.p:'bank'; drawSheet(); break;
    case 'fCat': syncForm(); F.c = v; drawSheet(); break;
    case 'fIconMode': syncForm(); F.iconMode = !F.iconMode; F.addOpen = false; drawSheet(); break;
    case 'fCatIcon': syncForm(); openIconPicker(v); break;
    case 'iconPickSheet': syncForm(); openIconPicker('__sheet'); break;
    case 'fAddOpen': syncForm(); F.addOpen = !F.addOpen; drawSheet(); if (F.addOpen) setTimeout(()=>{ const n=document.getElementById('ncName'); if (n) n.focus(); },30); break;
    case 'fAddCancel': syncForm(); F.addOpen = false; F.newName=''; F.newIcon=''; F.newBud=0; drawSheet(); break;
    case 'fAddSave': await sheetAddCat(); break;
    case 'fPay': syncForm(); F.p = v; if (v==='card' && !F.card) F.card = lastCard(); drawSheet(); break;
    case 'fCard': syncForm(); F.card = F.card===v ? '' : v; drawSheet(); break;
    case 'fCardAdd': { syncForm(); const n = (prompt('등록할 카드 이름을 입력하세요 (예: 현대카드, 우리카드)')||'').trim(); if (!n) break;
      const c = await addCard(n, ''); if (c && F){ F.card = c.id; drawSheet(); } break; }
    case 'cardAdd': { const n = (document.getElementById('newCardName').value||'').trim(); const l4 = (document.getElementById('newCardLast4').value||'').replace(/[^0-9]/g,'').slice(0,4);
      if (!n){ toast('카드 이름을 입력해 주세요.'); document.getElementById('newCardName').focus(); break; }
      await addCard(n, l4); setTimeout(()=>{ const el=document.getElementById('newCardName'); if (el) el.focus(); },0); break; }
    case 'cardDel': await deleteCard(v); break;
    case 'cardUp': case 'cardDown': { const arr = cardsList().slice(); const i = arr.findIndex(c=>c.id===v); const j = act==='cardUp'?i-1:i+1; if (i<0||j<0||j>=arr.length) break; [arr[i],arr[j]]=[arr[j],arr[i]]; S.settings.cards = arr; try{ await saveSettings(); }catch(err){ writeError(err); } break; }
    case 'payGo': V.view='list'; V.listMode='list'; V.filter='all'; V.payF=v; V.sel.clear(); render(); window.scrollTo(0,0); break;
    case 'payFClear': V.payF=null; render(); break;
    case 'goLauncher': location.href = LAUNCHER_URL; break;
    case 'imeDebug': { const api = window.pywebview && window.pywebview.api; const out = document.getElementById('imeOut');
      if (!api || !api.ime_debug){ toast('Rhyme 프로그램 창에서만 진단할 수 있어요.'); break; }
      document.getElementById('imeTest').focus();
      setTimeout(async () => { try { const r = await api.ime_debug(); out.style.display = 'block';
        out.textContent = (r.ok ? '✓ 한글 모드로 바뀌었어요.' : '✕ 한글 모드로 바꾸지 못했어요. 아래 내용을 캡처해 보내 주세요.') + '\n' + JSON.stringify(r.targets || r, null, 1);
        document.getElementById('imeTest').focus(); } catch(e){ out.style.display='block'; out.textContent = '진단 실패: ' + e; } }, 150);
      break; }
    case 'bkList': openBackupPicker(); break;
    case 'bkClose': closeBackupPicker(); break;
    case 'bkLoad': loadBackup(v); break;
    case 'autoHangul': localStorageSet(HANGUL_OFF_KEY, v==='off' ? '1' : '0'); render(); toast(v==='off' ? '한글 자동 전환을 껐어요.' : '이제 글자 칸을 누르면 한글로 시작해요.'); break;
    case 'openData': { try { const r = await fetch('/api/open-data-folder', {method:'POST'}); const j = await r.json(); toast(`데이터 폴더: ${j.path}`); } catch(e){ toast('데이터 폴더를 열지 못했어요.'); } break; }
    case 'fDay': syncForm(); F.d = iso(addDays(new Date(), +v)); drawSheet(); break;
    case 'fSug': syncForm(); F.m = b.dataset.m; if (F.a==='' ) F.a = +b.dataset.a; drawSheet(); break;
    case 'qAdd': syncForm(); F.a = (+F.a||0) + (+v); drawSheet(); break;
    case 'qNeg': syncForm(); F.a = -(+F.a||0) || ''; drawSheet(); break;
    case 'qClr': syncForm(); F.a=''; drawSheet(); document.getElementById('fAmt').focus(); break;
    case 'fSave': saveForm(!!b.dataset.more); break;
    case 'fDel': { const it = {...F, d:F.oldDate}; if (!confirm('이 내역을 지울까요?')) return; closeSheet(); if (await deleteItem(it)) toast('지웠어요.'); break; }
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S')){ e.preventDefault(); saveFile(); return; }
  if (e.key==='Escape' && document.getElementById('ghOverlay') && document.getElementById('ghOverlay').classList.contains('open')){ ghCloseSetup(); return; }
  if (e.key==='Escape' && document.getElementById('fsOverlay') && document.getElementById('fsOverlay').classList.contains('open')){ closeStorageSetup(); return; }
  if (e.key==='Escape' && document.getElementById('bkOverlay') && document.getElementById('bkOverlay').classList.contains('open')){ closeBackupPicker(); return; }
  if (e.key==='Escape' && document.getElementById('iconOverlay').classList.contains('open')){ closeIconPicker(); return; }
  if (e.key==='Enter' && e.target.id==='iconOwn'){ e.preventDefault(); document.querySelector('[data-act="iconOwn"]').click(); return; }
  if (e.key==='Escape' && !document.getElementById('mpicker').hidden){ closePicker(true); return; }
  if (e.key==='Escape' && F) closeSheet();
  if (e.key==='Enter' && e.target.closest('.addcard')){ e.preventDefault(); document.querySelector('[data-act="cardAdd"]').click(); return; }
  if (e.key==='Enter' && e.target.closest('.addcat')){ e.preventDefault(); document.querySelector('[data-act="catAdd"]').click(); return; }
  if (e.key==='Enter' && F && e.target.closest('.sheet-add')){ e.preventDefault(); sheetAddCat(); return; }
  if (e.key==='Enter' && F && e.target.matches('#fAmt,#fMemo')){ e.preventDefault(); saveForm(false); }
  if (e.key==='Enter' && e.target.dataset && e.target.dataset.fid && e.target.tagName==='INPUT'){ e.preventDefault(); e.target.blur(); }
  if (e.key==='Escape' && e.target.dataset && e.target.dataset.fid){ const [id,f]=e.target.dataset.fid.split('|'); const it=findItem(id); if (id.startsWith('cat:')){ render(); return; } if (it && f==='a') e.target.value=(it.a<0?'-':'')+won(Math.abs(it.a)); else if (it && f==='m') e.target.value=it.m||''; e.target.blur(); }
  if (e.key==='Enter' && e.target.matches('[data-edit]')) e.target.click();
});
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id==='overlay') closeSheet(); });
document.getElementById('iconOverlay').addEventListener('click', e => { if (e.target.id==='iconOverlay') closeIconPicker(); });
document.addEventListener('input', e => {
  if (e.target.id==='fAmt'){ const el=e.target; const neg = el.value.trim().startsWith('-'); const n = el.value.replace(/[^0-9]/g,''); el.value = n ? (neg?'-':'') + Number(n).toLocaleString('ko-KR') : (neg?'-':''); }
  if (e.target.classList.contains('amt-in')){ const el=e.target; const neg = el.value.trim().startsWith('-'); const n = el.value.replace(/[^0-9]/g,''); el.value = n ? (neg?'-':'') + Number(n).toLocaleString('ko-KR') : (neg?'-':''); return; }
  if (e.target.matches('[data-budget],[data-money],.fxedit [data-k="a"]')){ const n=e.target.value.replace(/[^0-9]/g,''); e.target.value = n?Number(n).toLocaleString('ko-KR'):''; }
  if (e.target.dataset.input==='q'){ V.q = e.target.value; const pos = e.target.selectionStart; render(); const s=document.querySelector('[data-input="q"]'); if (s){ s.focus(); s.setSelectionRange(pos,pos); } }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.check){ const id=e.target.dataset.check; if (e.target.checked) V.sel.add(id); else V.sel.delete(id); updateSelUI(); return; }
  if (e.target.dataset.fid && e.target.dataset.fid.startsWith('card:')){ cardFieldSave(e.target); return; }
  if (e.target.dataset.fid && e.target.dataset.fid.startsWith('ipn:')){ ipNameSave(e.target); return; }
  if (e.target.dataset.fid && e.target.dataset.fid.startsWith('cat:')){ catFieldSave(e.target); return; }
  if (e.target.dataset.fid){ inlineSave(e.target); return; }
  if (e.target.id==='catSelAll'){ if (e.target.checked) LIVE.forEach(k=>V.catSel.add(k)); else V.catSel.clear(); render(); return; }
  if (e.target.dataset.catcheck){ const k=e.target.dataset.catcheck; if (e.target.checked) V.catSel.add(k); else V.catSel.delete(k); e.target.closest('.budrow').classList.toggle('on', e.target.checked); const b=document.querySelector('[data-act="catDelSel"]'); if (b){ b.disabled=!V.catSel.size; b.textContent = V.catSel.size?`선택 항목 지우기 (${V.catSel.size})`:'선택 항목 지우기'; } const inf=document.getElementById('catSelInfo'); if (inf) inf.textContent = V.catSel.size?`${V.catSel.size}개 선택`:'선택한 항목 없음'; const sa=document.getElementById('catSelAll'); if (sa){ sa.checked = LIVE.every(x=>V.catSel.has(x)); sa.indeterminate = V.catSel.size>0 && !sa.checked; } return; }
  if (e.target.id==='selAll'){ const list = selectableItems(); if (e.target.checked) list.forEach(x=>V.sel.add(x.id)); else list.forEach(x=>V.sel.delete(x.id)); document.querySelectorAll('[data-check]').forEach(c=>c.checked=V.sel.has(c.dataset.check)); updateSelUI(); return; }
  if (e.target.id==='fDate' && F){ syncForm(); drawSheet(); }
  if (e.target.dataset.input==='weekStart'){ S.settings.weekStart = +e.target.value; try{ await saveSettings(); }catch(err){ writeError(err); } }
  if (e.target.dataset.input==='importJson' && e.target.files[0]) importJson(e.target.files[0]);
  if (e.target.dataset.input==='ghFirst' && e.target.files[0]){
    const f = e.target.files[0]; let o = null;
    try { const t = await f.text(); o = /\.html?$/i.test(f.name) ? extractEmbedded(t) : JSON.parse(t); } catch(_){}
    if (!o || !o.months){ toast('Rhyme 파일이나 백업(JSON)이 아니에요.'); return; }
    S.months = o.months; S.settings = {...structuredClone(DEFAULT_SETTINGS), ...(o.settings||{}), _u: Date.now()}; S.deleted = {};
    ghCloseSetup(); ghAfterConnect();
  }
});
const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', ()=>render());

applyTheme();
render();
initStore();
</script></body></html>
